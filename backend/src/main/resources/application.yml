spring:
  application:
    name: risklens-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/risklens}
    username: ${DATABASE_USER:risklens}
    password: ${DATABASE_PASSWORD:risklens_dev_password}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

risklens:
  risk-service:
    base-url: ${RISK_SERVICE_URL:http://localhost:8000}
    connect-timeout: ${RISK_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${RISK_SERVICE_READ_TIMEOUT:5s}
  review-threshold: ${RISK_REVIEW_THRESHOLD:0.70}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  pattern:
    level: "%5p [transactionId=%X{transactionId:-},caseId=%X{caseId:-}]"

