[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "risklens-evaluation"
version = "0.1.0"
description = "Offline quality evaluation for RiskLens transaction decisions"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.8,<1"]

[project.scripts]
risk-evaluate = "risk_evaluation.cli:main"
risk-calibrate = "risk_evaluation.calibrate_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/risk_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
